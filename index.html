<!DOCTYPE html>
<html id="html-wrapper" lang="de-DE">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_blank">
    <title>DeadEnd MMO</title>
    <meta name="description" content="Zombie Survival MMO">
    <meta name="keywords" content="Apocalyptic, Survival, MMO, Classic, Crafting, Looting, Build">
    <meta name="author" content="stuck1a">
    <link rel="icon" type="image/png" href="assets/gfx/favicon/favicon_60x60-32.png"/>
    <link rel="stylesheet" href="src/css/global.css" />
  </head>
  <body id="body-wrapper">
    <div id="content">
      <section id="container">
        <div id="wrapper">
          <button id="startBtn" onclick="initGame(this);">SPIEL STARTEN</button>
          <iframe id="stage" width="960" height="920" scrolling="no" allow="autoplay fullscreen" frameborder="0"></iframe>
        </div> 
      </section>
    </div>
    <script type="application/javascript">
      function initGame(btn) {
        let gameFrame = document.getElementById('stage');
        if (gameFrame) {
          gameFrame.setAttribute('src', 'game.html');
          gameFrame.style.visibility = 'visible';
        }
        btn.remove();
      }
    </script>
  </body>
</html>
